name: Build KBHX01 Firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile QMK in Docker
        run: |
          docker run --rm -v $(pwd):/workspace -w /workspace ghcr.io/qmk/qmk_cli:latest /bin/bash -c "
            qmk setup -y -H /tmp/qmk_firmware && \
            mkdir -p /tmp/qmk_firmware/keyboards/kbhx01 && \
            cp -r /workspace/config.h /workspace/info.json /workspace/rules.mk /workspace/keymaps /tmp/qmk_firmware/keyboards/kbhx01/ && \
            cd /tmp/qmk_firmware && \
            qmk compile -kb kbhx01 -km via && \
            cp /tmp/qmk_firmware/*.uf2 /workspace/
          "

      - name: Upload UF2 Firmware
        uses: actions/upload-artifact@v4
        with:
          name: kbhx01_via_firmware
          path: "*.uf2"
